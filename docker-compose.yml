name: docstudio

services:
  docstudio:
    build:
      context: .
      dockerfile: Dockerfile
    image: docstudio:local
    init: true
    restart: unless-stopped
    command: ["serve", "/vault", "--host", "0.0.0.0", "--port", "4321"]
    environment:
      DOCSTUDIO_BLOCK_EGRESS: "1"
      # Host edits must reach the index even when the bind mount does not
      # forward inotify events to the container.
      DOCSTUDIO_WATCH_POLL: "1"
    ports:
      # Bind to loopback only: reachable from this machine, not from the LAN.
      - "127.0.0.1:${DOCSTUDIO_PORT:-4321}:4321"
    volumes:
      # The vault is mounted read-only: markdown stays the single source of
      # truth and the container cannot modify it.
      - "${DOCSTUDIO_VAULT:-./fixtures/vault-demo}:/vault:ro"
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN installs the egress firewall; SETUID/SETGID let su-exec hand
      # the server over to the unprivileged node user.
      - NET_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /run:size=4m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/api/meta"]
      interval: 30s
      timeout: 3s
      retries: 3
